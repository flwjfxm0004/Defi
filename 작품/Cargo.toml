[workspace]
resolver = "2"
members = [
    "kernel/math_q32",
    "kernel/verifier_abi",
    "kernel/world_ledger",
    "kernel/sakuga_biomech",
    "kernel/typo_hangul",
    "kernel/dsp_studio",
    "kernel/spirv_emit",
    "kernel/codec_mkv",
    "kernel/anime_qvm",
    "kernel/ledger_wal",
    "kernel/render_hybrid",
    "kernel/player_bin",
    "verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.154" }
ron = { version = "=0.8.1" }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
rayon = { version = "=1.12.0" }
arc-swap = { version = "=1.9.5" }
ash = { version = "=0.38.0", default-features = false, features = ["debug"] }
gpu-allocator = { version = "=0.27.0", default-features = false, features = ["vulkan"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
raw-window-handle = { version = "=0.6.2" }
ash-window = { version = "=0.13.0" }
cpal = { version = "=0.15.3" }

math_q32 = { path = "kernel/math_q32" }
verifier_abi = { path = "kernel/verifier_abi" }
world_ledger = { path = "kernel/world_ledger" }
sakuga_biomech = { path = "kernel/sakuga_biomech" }
typo_hangul = { path = "kernel/typo_hangul" }
dsp_studio = { path = "kernel/dsp_studio" }
spirv_emit = { path = "kernel/spirv_emit" }
codec_mkv = { path = "kernel/codec_mkv" }
anime_qvm = { path = "kernel/anime_qvm" }
ledger_wal = { path = "kernel/ledger_wal" }
render_hybrid = { path = "kernel/render_hybrid" }

[profile.dev]
codegen-units = 1
incremental = false

[profile.dev.package."*"]
codegen-units = 1

[profile.test]
codegen-units = 1
incremental = false

[profile.test.package."*"]
codegen-units = 1

[profile.release]
codegen-units = 1
incremental = false

[profile.release.package."*"]
codegen-units = 1

